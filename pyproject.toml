[tool.poetry]
name = "misuperprofe-chat-agent"
version = "0.1.0"
description = "Agente de chat para MiSuperProfe con LangGraph y AG-UI"
authors = ["MiSuperProfe Team <dev@misuperprofe.com>"] # Placeholder actualizado
readme = "README.md"
packages = [{include = "app"}]

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "~3.11"
fastapi = ">=0.115.12,<0.116.0"  # Actualizado
uvicorn = "^0.31.0"  # Actualizado
pydantic = {version = "^2.7.1", extras = ["email"]}
pydantic-settings = "^2.2.1"
httpx = "^0.28.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
tenacity = "^9.1.2"
sqlalchemy = "^2.0.28"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
langchain = "^0.3.1"  # Actualizado
langchain-core = "^0.3.25"  # Actualizado
langchain-text-splitters = "^0.3.8"
langchain-google-genai = "^2.1.0"
ag-ui-protocol = "^0.1.5"
langchain-redis = "^0.2.2"
langgraph-checkpoint-redis = "^0.0.7"
torch = { version = "*", source = "pytorch_cpu" }
python-dotenv = "^1.0.1"
markdown = "^3.5.2"
pandas = "^2.2.1"
asyncpg = "^0.29.0"
faiss-cpu = "^1.7.4"
sentence-transformers = "^2.7.0"
rapidfuzz = "^3.13.0"
redis = "^5.0.1"
litellm = "^1.39.0"

# Dependencias añadidas/actualizadas del ejemplo lang-graph-service
langchain-openai = "^0.2.1"
langchain-anthropic = "^0.2.1"
openai = "^1.51.0"
langchain-community = "^0.3.1"
copilotkit = "0.1.46"
langgraph = ">=0.3.0"  # Modificado: Rango más amplio
langgraph-cli = {extras = ["inmem"], version = "^0.1.0"} # Modificado: Usar caret para mayor flexibilidad
fastmcp = "^2.9.0"
matplotlib = "^3.10.3"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
mypy = "^1.9.0"
black = "^24.3.0"
ruff = "^0.3.5"
pre-commit = "^3.7.0"
types-redis = "^4.6.0.20240311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 