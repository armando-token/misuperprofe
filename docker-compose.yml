version: '3.8'

services:
  db:
    image: postgres:15
    container_name: misuperpostgre
    environment:
      POSTGRES_USER: mysuper_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: mysuper_bd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # Para backups automáticos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysuper_user -d mysuper_bd"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped  # Reinicio automático

  redis:
    image: redis:7-alpine
    container_name: misuperredis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis_backups:/backups  # Para backups de Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped  # Reinicio automático
    command: redis-server --appendonly yes  # Habilitar persistencia AOF

  misuperapi:
    build: .
    container_name: misuperapi
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=mysuper_user
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=mysuper_bd
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE_URL=postgresql+psycopg2://mysuper_user:postgres_password@db:5432/mysuper_bd
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=AVerySecureKeyPleaseChangeInProduction
      - JWT_ALGORITHM=HS256
      - ENVIRONMENT=development
      - APP_NAME=MySuperProfeAPI
      - API_V1_STR=/api/v1
      - API_KEY=your_api_key_here
      - GOOGLE_API_KEY=your_google_api_key_here
      - LANGSMITH_API_KEY=your_langsmith_api_key_here
      - OPENAI_API_KEY=your_openai_api_key_here
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd /app/src && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./src:/app/src
      - ./content:/app/content
      - ./scripts:/app/scripts
      - ./logs:/app/logs  # Para logs persistentes
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    restart: unless-stopped  # Reinicio automático

  caddy:
    image: caddy:2.7.6
    container_name: misupercaddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - misuperapi

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local 